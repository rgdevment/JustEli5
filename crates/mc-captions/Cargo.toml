[package]
name = "mc-captions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "AXError", "AXUIElement", "AXValue", "HIServices", "libc", "objc2"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "alloc", "CFArray", "CFBase", "CFDictionary", "CFNumber", "CFString"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[dependencies]
mc-core = { path = "../mc-core" }
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
