[package]
name = "mc-asr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Local Whisper engine (builds whisper.cpp: needs cmake and a C++ compiler).
whisper = ["dep:whisper-rs"]
cuda = ["whisper", "whisper-rs/cuda"]
vulkan = ["whisper", "whisper-rs/vulkan"]

[dependencies]
mc-audio = { path = "../mc-audio" }
mc-core = { path = "../mc-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11"
thiserror = "2.0.21"
whisper-rs = { version = "0.16", optional = true, default-features = false }

# Apple GPUs are always there on macOS: Whisper runs on Metal without a flag.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", optional = true, default-features = false, features = ["metal"] }

[dev-dependencies]
tempfile = "3.27.0"
