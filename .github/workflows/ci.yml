name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace:
    name: CLI workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: ./.github/actions/whisper-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # fmt, clippy with Whisper and the tests: what a person runs before pushing.
      - name: scripts/ci.sh
        shell: bash
        run: bash scripts/ci.sh

  window:
    name: Desktop window
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: ./.github/actions/frontend
      - name: Types and the build
        working-directory: apps/mc-gui
        run: pnpm build
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/mc-gui/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `externalBin` must exist for the crate to compile; lint needs a file there, not a working CLI.
      - name: A stand-in for the CLI
        run: |
          mkdir -p apps/mc-gui/src-tauri/binaries
          : > apps/mc-gui/src-tauri/binaries/eli5-x86_64-pc-windows-msvc.exe
      - name: Format
        working-directory: apps/mc-gui/src-tauri
        run: cargo fmt -- --check
      - name: Clippy
        working-directory: apps/mc-gui/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
