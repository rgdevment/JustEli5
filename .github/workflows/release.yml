name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build. Publishes nothing."
        required: false
        default: "0.0.0-dispatch"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BUILD_MACOS: "false"

jobs:
  tested:
    name: Tested when it landed
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: This commit was tested when it landed
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in $(seq 1 120); do
            if ! said=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push \
              --limit 1 --json status,conclusion \
              --jq 'if length == 0 then "" else .[0] | "\(.status) \(.conclusion)" end' \
              2>"$RUNNER_TEMP/gh.err"); then
              echo "::error::the run history could not be read: $(cat "$RUNNER_TEMP/gh.err")"
              exit 1
            fi
            case "$said" in
              "completed success")
                echo "the commit this tag names passed CI on main"
                exit 0
                ;;
              "completed "*)
                echo "::error::CI on ${GITHUB_SHA:0:8} ended ${said#completed }, so this tag is not a release"
                exit 1
                ;;
              "")
                echo "no CI run for ${GITHUB_SHA:0:8} yet (${attempt}/120)"
                sleep 30
                ;;
              *)
                echo "CI on ${GITHUB_SHA:0:8} is still running (${attempt}/120)"
                sleep 30
                ;;
            esac
          done
          echo "::error::an hour and CI on ${GITHUB_SHA:0:8} has not finished, or never ran: a tag belongs on a commit that reached main and was tested there"
          exit 1

  version:
    name: Resolve the version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      macos: ${{ steps.resolve.outputs.macos }}
    env:
      HAS_P12: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
      HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
      HAS_APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD != '' }}
      HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
      HAS_APPLE_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      HAS_UPDATER_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
      HAS_PFX: ${{ secrets.PFX_BASE64 != '' }}
      HAS_PFX_PASSWORD: ${{ secrets.PFX_PASSWORD != '' }}
    steps:
      - name: Signing secrets come in pairs
        run: |
          fail() { echo "::error::$1"; exit 1; }

          if [ "$HAS_PFX" = "true" ] && [ "$HAS_PFX_PASSWORD" != "true" ]; then
            fail "PFX_BASE64 is set but PFX_PASSWORD is empty"
          fi
          if [ "$HAS_P12" = "true" ] && [ "$HAS_P12_PASSWORD" != "true" ]; then
            fail "MACOS_CERTIFICATE_P12 is set but MACOS_CERTIFICATE_PASSWORD is empty"
          fi
          if [ "$HAS_APPLE_ID" = "true" ] &&
            { [ "$HAS_APPLE_APP_PASSWORD" != "true" ] || [ "$HAS_APPLE_TEAM_ID" != "true" ]; }; then
            fail "APPLE_ID is set but APPLE_APP_PASSWORD or APPLE_TEAM_ID is empty"
          fi
          if [ "$HAS_P12" = "true" ] && [ "$HAS_APPLE_IDENTITY" != "true" ]; then
            fail "MACOS_CERTIFICATE_P12 is set but APPLE_SIGNING_IDENTITY is empty: the app would be bundled unsigned"
          fi
          if [ "$HAS_UPDATER_KEY" = "true" ] && [ "$HAS_UPDATER_PASSWORD" != "true" ]; then
            echo "::notice::the updater key carries no password; that is fine if it was made without one"
          fi
          if [ "$HAS_UPDATER_KEY" != "true" ]; then
            echo "::warning::no updater key; this release cannot be installed by an existing copy"
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            missing=""
            want() { [ "$2" = "true" ] || missing="$missing $1"; }
            want TAURI_SIGNING_PRIVATE_KEY "$HAS_UPDATER_KEY"
            want PFX_BASE64 "$HAS_PFX"
            want PFX_PASSWORD "$HAS_PFX_PASSWORD"
            if [ "$BUILD_MACOS" = "true" ]; then
              want MACOS_CERTIFICATE_P12 "$HAS_P12"
              want MACOS_CERTIFICATE_PASSWORD "$HAS_P12_PASSWORD"
              want APPLE_SIGNING_IDENTITY "$HAS_APPLE_IDENTITY"
              want APPLE_ID "$HAS_APPLE_ID"
              want APPLE_APP_PASSWORD "$HAS_APPLE_APP_PASSWORD"
              want APPLE_TEAM_ID "$HAS_APPLE_TEAM_ID"
            fi
            [ -z "$missing" ] || fail "this tag would be released without:$missing. Add them under Settings > Secrets and variables > Actions, or set BUILD_MACOS to false in release.yml to leave macOS out"
          fi

          echo "signing secrets are coherent"

      - id: resolve
        env:
          ASKED_FOR: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(.+)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            version="$ASKED_FOR"
          fi

          strict='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          strict+='(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          strict+='(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if [[ ! "$version" =~ $strict ]]; then
            echo "::error::«$version» is not a version semver reads (1.2.3 or 1.2.3-rc.1)"
            exit 1
          fi

          if [[ "$version" =~ -rc[0-9]{2,} ]]; then
            echo "::error::«$version» has to be written rc.${BASH_REMATCH[0]#-rc}: past rc9, semver reads rc10 as older than rc2"
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "macos=${BUILD_MACOS}" >> "$GITHUB_OUTPUT"
          echo "version $version (pre-release: $prerelease)"

  bundle-windows:
    name: justeli5-windows-installer
    needs: [version, tested]
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      TARGET: x86_64-pc-windows-msvc
      HAS_PFX: ${{ secrets.PFX_BASE64 != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      OUT: apps/mc-gui/src-tauri/target/release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare
        with:
          version: ${{ needs.version.outputs.version }}
          targets: ${{ env.TARGET }}

      - uses: ./.github/actions/frontend

      - uses: ./.github/actions/sidecar

      - name: Teach the bundler to sign what it packs
        if: env.HAS_PFX == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "bundler.pfx"
          Set-Content -Path $pfx -Value ([Convert]::FromBase64String($env:PFX_BASE64)) -AsByteStream
          try {
            $said = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx `
              -CertStoreLocation Cert:\CurrentUser\My -Password $said |
              Where-Object { $_.HasPrivateKey } | Select-Object -First 1
            if (-not $cert) { Write-Error "the PFX holds no certificate with its private key"; exit 1 }
          } finally {
            Remove-Item $pfx -ErrorAction SilentlyContinue
          }

          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Error "signtool not found"; exit 1 }

          @{ bundle = @{ windows = @{ signCommand = @{
            cmd = $signtool.FullName
            args = @("sign", "/sha1", $cert.Thumbprint, "/fd", "sha256",
              "/tr", "http://timestamp.digicert.com", "/td", "sha256", "%1")
          } } } } | ConvertTo-Json -Depth 8 | Set-Content -Path apps/mc-gui/sign.json -Encoding utf8
          "CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "the bundler signs with $($cert.Thumbprint)"

      - name: Bundle
        working-directory: apps/mc-gui
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          args=(--bundles nsis)
          # Without the updater key only the update artifacts are left out; Authenticode and codesign still run.
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then args+=(--config '{"bundle":{"createUpdaterArtifacts":false}}'); fi
          if [ -f sign.json ]; then args+=(--config sign.json); fi
          pnpm tauri build "${args[@]}"

      - name: The installer carries the CLI
        shell: bash
        run: |
          setup=$(ls "$OUT"/bundle/nsis/*-setup.exe 2>/dev/null | head -1) || true
          if [ -z "$setup" ]; then
            echo "::error::the bundler produced no installer"
            exit 1
          fi
          script=$(ls "$OUT"/nsis/*/installer.nsi | head -1)
          if [ -z "$script" ] || ! grep -q 'oname=eli5.exe' "$script"; then
            echo "::error::the generated installer script does not lay down eli5; the sidecar was not bundled"
            exit 1
          fi
          echo "the installer lays down eli5"

      - name: What the installer will put on disk is signed
        if: env.HAS_PFX == 'true'
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path "$env:OUT/bundle/nsis" -Filter "*-setup.exe" |
            Select-Object -First 1
          if (-not $setup) { Write-Error "no installer to open"; exit 1 }

          $seven = @(
            "C:\Program Files\7-Zip\7z.exe",
            "C:\Program Files (x86)\7-Zip\7z.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $seven) {
            $seven = (Get-Command 7z, 7za -ErrorAction SilentlyContinue |
              Select-Object -First 1).Source
          }
          if (-not $seven) { Write-Error "no 7-Zip to open the installer with"; exit 1 }

          $peek = Join-Path $env:RUNNER_TEMP "peek"
          & $seven x $setup.FullName "-o$peek" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error "the installer could not be opened"; exit 1 }

          $mine = Get-ChildItem -Path $peek -Recurse -File |
            Where-Object { $_.Extension -in ".exe", ".dll" -and $_.FullName -notmatch [regex]::Escape('$PLUGINSDIR') }
          if (-not $mine) { Write-Error "the installer holds nothing to run"; exit 1 }

          $status = 0
          foreach ($one in $mine) {
            $where = $one.FullName.Substring($peek.Length).TrimStart("\\")
            $sig = Get-AuthenticodeSignature $one.FullName
            if (-not $sig.SignerCertificate) {
              Write-Error "$where goes out unsigned"
              $status = 1
            } elseif ($sig.SignerCertificate.Thumbprint -ne $env:CERT_THUMBPRINT) {
              Write-Error "$where is signed by $($sig.SignerCertificate.Subject), which is not this build's certificate"
              $status = 1
            } elseif (-not $sig.TimeStamperCertificate) {
              Write-Error "$where is signed without a timestamp, so it dies with the certificate"
              $status = 1
            } else {
              Write-Host "$where <- $($sig.SignerCertificate.Subject)"
            }
          }
          exit $status

      - name: Sign the installer
        if: env.HAS_PFX == 'true'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -like "*x64*" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Error "signtool not found"; exit 1 }

          $setup = Get-ChildItem -Path "$env:OUT/bundle/nsis" -Filter "*-setup.exe" |
            Select-Object -First 1
          if (-not $setup) { Write-Error "no installer to sign"; exit 1 }

          & $signtool.FullName sign /sha1 $env:CERT_THUMBPRINT /fd sha256 `
            /tr http://timestamp.digicert.com /td sha256 $setup.FullName
          if ($LASTEXITCODE -ne 0) { Write-Error "signing failed"; exit 1 }

          $sig = Get-AuthenticodeSignature $setup.FullName
          if (-not $sig.TimeStamperCertificate) {
            Write-Error "no timestamp: the signature would die with the certificate"; exit 1
          }
          if ($sig.SignerCertificate.Thumbprint -ne $env:CERT_THUMBPRINT) {
            Write-Error "the installer was signed by $($sig.SignerCertificate.Subject), not by this build's certificate"; exit 1
          }
          Write-Host "status: $($sig.Status)"

      - name: Name it after the release
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          setup=$(ls "$OUT"/bundle/nsis/*-setup.exe 2>/dev/null | head -1) || true
          if [ -z "$setup" ]; then
            echo "::error::the bundler produced no installer"
            exit 1
          fi
          cp "$setup" "dist/justeli5-installer-$VERSION-windows-x86_64.exe"
          ls -l dist

      # After the Authenticode signature, so the updater signs the bytes that are published.
      - name: Sign it for the updater
        if: env.HAS_UPDATER_KEY == 'true'
        working-directory: apps/mc-gui
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          exe="../../dist/justeli5-installer-$VERSION-windows-x86_64.exe"
          rm -f "$exe.sig"
          pnpm tauri signer sign "$exe"
          test -s "$exe.sig" || { echo "::error::no updater signature was written"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-windows
          path: dist/*
          retention-days: 7
          if-no-files-found: error

      - name: Take the certificate back out of the store
        if: always() && env.CERT_THUMBPRINT != ''
        shell: pwsh
        run: |
          $gone = Get-ChildItem Cert:\CurrentUser\My |
            Where-Object { $_.Thumbprint -eq $env:CERT_THUMBPRINT }
          $gone | Remove-Item -Force -ErrorAction SilentlyContinue
          Write-Host "removed $($gone.Count) certificate(s) from the runner store"

  bundle-macos:
    name: justeli5-macos-installer (${{ matrix.arch }})
    needs: [version, tested]
    if: needs.version.outputs.macos == 'true'
    # Each chip builds on its own: whisper.cpp is compiled natively rather than cross-compiled.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
            runner: macos-latest
          - target: x86_64-apple-darwin
            arch: x86_64
            runner: macos-15-intel
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      HAS_P12: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      OUT: apps/mc-gui/src-tauri/target/${{ matrix.target }}/release/bundle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare
        with:
          version: ${{ needs.version.outputs.version }}
          targets: ${{ matrix.target }}

      - uses: ./.github/actions/frontend

      - name: One deployment target for the CLI and the window
        run: |
          floor=$(jq -r '.bundle.macOS.minimumSystemVersion' apps/mc-gui/src-tauri/tauri.conf.json)
          echo "MACOSX_DEPLOYMENT_TARGET=$floor" >> "$GITHUB_ENV"

      - uses: ./.github/actions/sidecar
        with:
          target: ${{ matrix.target }}

      - name: Import signing certificate
        if: env.HAS_P12 == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # With APPLE_SIGNING_IDENTITY the bundler signs the window and eli5 with the hardened
      # runtime and Entitlements.plist; notarisation is done below, on the finished files.
      - name: Bundle
        working-directory: apps/mc-gui
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          args=(--target "$TARGET" --bundles "app,dmg")
          # Without the updater key only the update artifacts are left out; Authenticode and codesign still run.
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then args+=(--config '{"bundle":{"createUpdaterArtifacts":false}}'); fi
          pnpm tauri build "${args[@]}"

      - name: It carries the CLI, on one chip
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          app="$OUT/macos/JustEli5.app"
          plist="$app/Contents/Info.plist"
          test -d "$app" || { echo "::error::the bundler produced no app"; exit 1; }
          status=0
          want() {
            if [ "$(plutil -extract "$1" raw -o - "$plist" 2>/dev/null)" != "$2" ]; then
              echo "::error::$1 is «$(plutil -extract "$1" raw -o - "$plist" 2>/dev/null)», not «$2»"
              status=1
            fi
          }
          want CFBundleIdentifier dev.rgdevment.justeli5
          want CFBundleShortVersionString "$VERSION"
          chip=x86_64; [ "$ARCH" = aarch64 ] && chip=arm64
          bin="$app/Contents/MacOS/eli5"
          if [ -x "$bin" ]; then
            archs=$(lipo -archs "$bin")
            [ "$archs" = "$chip" ] || { echo "::error::eli5 is «$archs», not $chip alone"; status=1; }
            echo "eli5: $archs"
          else
            echo "::error::eli5 is not in the bundle"
            status=1
          fi
          exit $status

      - name: The app is really signed, and may use the microphone
        if: env.HAS_P12 == 'true'
        run: |
          app="$OUT/macos/JustEli5.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          if codesign -dv "$app" 2>&1 | grep -q "Signature=adhoc"; then
            echo "::error::$app came out ad-hoc signed; notarisation would refuse it"
            exit 1
          fi
          # Under the hardened runtime a binary without this entitlement records silence, and says nothing.
          for bin in "$app"/Contents/MacOS/*; do
            if ! codesign -d --entitlements - --xml "$bin" 2>/dev/null | grep -q "com.apple.security.device.audio-input"; then
              echo "::error::$(basename "$bin") is signed without the audio-input entitlement"
              exit 1
            fi
          done

      - name: Notarize
        if: env.HAS_APPLE_ID == 'true' && env.HAS_P12 == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg=$(ls "$OUT"/dmg/*.dmg | head -1)
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 900
          xcrun stapler staple "$dmg"

      - name: Staple the app itself, and tar it again
        if: env.HAS_APPLE_ID == 'true' && env.HAS_P12 == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          out="$OUT/macos"
          app="$out/JustEli5.app"

          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 900
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"

          rm -f "$out"/*.app.tar.gz "$out"/*.app.tar.gz.sig
          COPYFILE_DISABLE=1 tar --no-xattrs -czf "$out/JustEli5.app.tar.gz" -C "$out" JustEli5.app

          rm -rf "$RUNNER_TEMP/rt" && mkdir -p "$RUNNER_TEMP/rt"
          tar -xzf "$out/JustEli5.app.tar.gz" -C "$RUNNER_TEMP/rt"
          codesign --verify --deep --strict "$RUNNER_TEMP/rt/JustEli5.app"
          xcrun stapler validate "$RUNNER_TEMP/rt/JustEli5.app"

      - name: Sign it for the updater
        if: env.HAS_UPDATER_KEY == 'true' && env.HAS_APPLE_ID == 'true'
        working-directory: apps/mc-gui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          tarball="../../$OUT/macos/JustEli5.app.tar.gz"
          pnpm tauri signer sign "$tarball"
          test -s "$tarball.sig"

      - name: Name it after the release
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          out="$OUT/macos"
          app="$out/JustEli5.app"
          if xcrun stapler validate "$app" >/dev/null 2>&1 \
            && [ -s "$out/JustEli5.app.tar.gz.sig" ]; then
            cp "$out/JustEli5.app.tar.gz" "dist/justeli5-$VERSION-macos-$ARCH.app.tar.gz"
            cp "$out/JustEli5.app.tar.gz.sig" "dist/justeli5-$VERSION-macos-$ARCH.app.tar.gz.sig"
          else
            echo "::warning::no stapled, signed tarball; macOS $ARCH gets no self-update this release"
          fi
          dmg=$(ls "$OUT"/dmg/*.dmg 2>/dev/null | head -1) || true
          if [ -z "$dmg" ]; then
            echo "::error::the bundler produced no disk image"
            exit 1
          fi
          cp "$dmg" "dist/justeli5-installer-$VERSION-macos-$ARCH.dmg"
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-macos-${{ matrix.arch }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

      - name: Cleanup keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH" || true

  publish:
    name: GitHub Release
    needs: [tested, version, bundle-windows, bundle-macos]
    if: >-
      !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      && needs.tested.result == 'success'
      && needs.version.result == 'success'
      && needs.bundle-windows.result == 'success'
      && (needs.bundle-macos.result == 'success' || needs.bundle-macos.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Global: one manifest branch and one Latest flag; a third tag cancels the waiting one, re-run it by hand.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      MACOS: ${{ needs.version.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true # zizmor: ignore[artipacked] it pushes the manifest branch

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true

      - name: Everything that should be here, is
        run: |
          ls -l dist
          v="$VERSION"
          status=0
          want="dist/justeli5-installer-$v-windows-x86_64.exe"
          if [ "$MACOS" = "true" ]; then
            for arch in aarch64 x86_64; do
              want="$want dist/justeli5-$v-macos-$arch.app.tar.gz"
              if [ ! -s "dist/justeli5-installer-$v-macos-$arch.dmg" ]; then
                echo "::error::the macOS $arch disk image is missing"
                status=1
              fi
            done
          fi
          for one in $want; do
            if [ ! -s "$one" ]; then
              echo "::error::$one is missing or empty"
              status=1
            fi
            if [ ! -s "$one.sig" ]; then
              echo "::error::$one.sig is missing; the release would offer an update nobody can take"
              status=1
            fi
          done
          exit $status

      - name: The signature answers to the key this build ships
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq minisign && break
            echo "minisign would not install (${attempt}/3)"
            sleep $((attempt * 5))
          done
          command -v minisign
          v="$VERSION"

          jq -r '.plugins.updater.pubkey' apps/mc-gui/src-tauri/tauri.conf.json | base64 -d > feed.pub
          for one in "dist/justeli5-installer-$v-windows-x86_64.exe" \
                     "dist/justeli5-$v-macos-aarch64.app.tar.gz" \
                     "dist/justeli5-$v-macos-x86_64.app.tar.gz"; do
            [ -s "$one" ] || continue
            base64 -d < "$one.sig" > one.minisig
            if ! minisign -Vm "$one" -p feed.pub -x one.minisig; then
              echo "::error::$one was signed with a key that is not the one in tauri.conf.json. Every copy built from this tree carries that public key, so nothing could ever verify this update. Nothing was published."
              exit 1
            fi
          done
          rm -f feed.pub one.minisig
          echo "the signatures and the shipped key are halves of the same pair"

      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      # GitHub keeps attestations only for public repositories when the owner is a person.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/justeli5-*,dist/SHA256SUMS

      - name: Notes from the tag
        id: notes
        run: |
          # checkout leaves the tag lightweight; fetching it again brings back its annotation.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          body=$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "${GITHUB_REF_NAME}" \
            | sed '/-----BEGIN SSH SIGNATURE-----/,$d' \
            | sed -e :a -e '/^\n*$/{$d;N;ba}')
          edge="JE_EOF_$(openssl rand -hex 8)"
          {
            echo "body<<$edge"
            echo "$body"
            echo "$edge"
          } >> "$GITHUB_OUTPUT"

      - name: The feed does not walk backwards
        run: |
          v="$VERSION"
          if ! git fetch origin manifest --depth 1 2>/dev/null; then
            if git ls-remote --exit-code --heads origin manifest >/dev/null 2>&1; then
              echo "::error::the feed exists and could not be read, so it cannot be checked"
              exit 1
            fi
            echo "no feed yet"
            exit 0
          fi
          feed=$(git show FETCH_HEAD:release-manifest.json 2>/dev/null || echo '{}')
          if [ "$PRERELEASE" = "true" ]; then
            was=$(jq -r '.latestPrerelease // ""' <<< "$feed"); track="candidates"
          else
            was=$(jq -r '.latest // ""' <<< "$feed"); track="stable"
          fi
          if [ -n "$was" ] && [ "$was" != "$v" ] \
             && [ "$(printf '%s\n%s\n' "$was" "$v" | sort -V | tail -1)" != "$v" ]; then
            echo "::error::the $track feed already says $was; publishing $v would hand everybody a version they left behind"
            exit 1
          fi
          echo "the $track feed says «${was:-nothing}»; $v may follow"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          tag="$GITHUB_REF_NAME"
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"

          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if ! grep -qxF "$tag" <<< "$tags"; then
            gh release create "$tag" --draft --verify-tag --title "$tag" \
              --prerelease="$PRERELEASE" --generate-notes --notes-file "$RUNNER_TEMP/notes.md"
          fi

          state=$(gh release view "$tag" --json isDraft,assets)
          draft=$(jq -r .isDraft <<< "$state")
          for f in dist/*; do
            name=$(basename "$f")
            have=$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .digest // ""' <<< "$state")
            want="sha256:$(sha256sum "$f" | cut -d' ' -f1)"
            if [ "$have" = "$want" ]; then
              echo "$name is already up, same bytes"
              continue
            fi
            if [ "$draft" = false ] && [ -n "$have" ]; then
              echo "::error::$name is published with other bytes; this run would replace a live file. Rerun only the failed jobs, or delete the release and let it be made again."
              exit 1
            fi
            secs=$((180 + $(stat -c %s "$f") / 50000))
            for attempt in 1 2 3; do
              began=$(date +%s)
              if timeout "$secs" gh release upload "$tag" "$f" --clobber; then
                echo "$name is up in $(( $(date +%s) - began ))s"
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error::$name never made it up; the release stays a draft"
                exit 1
              fi
              echo "::warning::$name stalled after ${secs}s (${attempt}/3)"
              sleep $((attempt * 10))
            done
          done

          have=$(gh release view "$tag" --json assets -q '.assets[].name' | sort)
          want=$(ls dist | sort)
          missing=$(comm -23 <(echo "$want") <(echo "$have"))
          if [ -n "$missing" ]; then
            echo "::error::the release is missing files this run built; it stays a draft"
            echo "$missing"
            exit 1
          fi

          latest=false; [ "$PRERELEASE" = "false" ] && latest=true
          gh release edit "$tag" --draft=false --latest="$latest"

      # What the window reads: latest.json for the stable channel, candidate.json for a pre-release.
      - name: The feed
        run: |
          v="$VERSION"
          base="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"
          win="justeli5-installer-$v-windows-x86_64.exe"
          arm="justeli5-$v-macos-aarch64.app.tar.gz"
          intel="justeli5-$v-macos-x86_64.app.tar.gz"

          if [ ! -s "dist/$win.sig" ]; then
            echo "::error::no updater signature for $v; the release would offer an update nobody can take"
            exit 1
          fi
          ws=$(cat "dist/$win.sig")
          as=$(cat "dist/$arm.sig" 2>/dev/null || true)
          is=$(cat "dist/$intel.sig" 2>/dev/null || true)
          if [ "$MACOS" = "true" ] && { [ -z "$as" ] || [ -z "$is" ]; }; then
            echo "::error::no updater signature for a Mac, so no Mac would be offered $v"
            exit 1
          fi
          jq -n --arg v "$v" \
                --arg n "https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}" \
                --arg wu "$base/$win" --arg ws "$ws" \
                --arg au "$base/$arm" --arg as "$as" \
                --arg iu "$base/$intel" --arg is "$is" \
            '{version: $v, notes: $n, platforms:
               ({"windows-x86_64": {url: $wu, signature: $ws}}
                + (if $as == "" then {} else {"darwin-aarch64": {url: $au, signature: $as}} end)
                + (if $is == "" then {} else {"darwin-x86_64": {url: $iu, signature: $is}} end))}' \
            > "$RUNNER_TEMP/channel.json"
          cat "$RUNNER_TEMP/channel.json"

          # An orphan branch: the feed and nothing else, never a copy of the source.
          if git fetch origin manifest --depth 1 2>/dev/null; then
            git checkout -B manifest FETCH_HEAD
          else
            git checkout --orphan manifest
            git rm -rq --cached . 2>/dev/null || true
            rm -f release-manifest.json latest.json candidate.json
          fi

          if [ "$PRERELEASE" = "true" ]; then
            was=$(jq -r '.latestPrerelease // ""' release-manifest.json 2>/dev/null || echo "")
            track="candidates"
          else
            was=$(jq -r '.latest // ""' release-manifest.json 2>/dev/null || echo "")
            track="stable"
          fi
          if [ -n "$was" ] && [ "$was" != "$v" ] \
             && [ "$(printf '%s\n%s\n' "$was" "$v" | sort -V | tail -1)" != "$v" ]; then
            echo "::error::the $track feed already says $was, and this run would set it back to $v. Nothing was written."
            exit 1
          fi

          latest=$(jq -r '.latest // ""' release-manifest.json 2>/dev/null || echo "")
          ahead=$(jq -r '.latestPrerelease // ""' release-manifest.json 2>/dev/null || echo "")
          if [ "$PRERELEASE" = "true" ]; then
            jq -n --arg l "${latest:-0.0.0}" --arg c "$v" \
              '{schema: 1, latest: $l, latestPrerelease: $c}' > release-manifest.json
            cp "$RUNNER_TEMP/channel.json" candidate.json
          else
            keep=""
            if [ -n "$ahead" ] \
               && [ "$(printf '%s\n%s\n' "${ahead%%-*}" "$v" | sort -V | tail -1)" != "$v" ]; then
              keep="$ahead"
            fi
            if [ -n "$keep" ]; then
              jq -n --arg l "$v" --arg c "$keep" \
                '{schema: 1, latest: $l, latestPrerelease: $c}' > release-manifest.json
            else
              jq -n --arg l "$v" '{schema: 1, latest: $l}' > release-manifest.json
              rm -f candidate.json
            fi
            cp "$RUNNER_TEMP/channel.json" latest.json
          fi
          cat release-manifest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for one in release-manifest.json latest.json candidate.json; do
            git add -A -- "$one" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "already says $v"
            exit 0
          fi
          git commit -m "chore: release manifest for $v"
          for attempt in 1 2 3 4 5; do
            if git push origin manifest; then
              exit 0
            fi
            echo "the feed would not push (${attempt}/5)"
            git fetch origin manifest || true
            git rebase FETCH_HEAD || git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo "::error::the feed could not be pushed; the release is out and nothing announces it"
          exit 1
