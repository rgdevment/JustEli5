name: Rules

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conventions:
    name: Project conventions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Parsing says nothing of a needs that names a job that is gone, or of input expanded into a shell;
      # and the release only runs on a pushed tag, too late to learn either.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: zizmor@1.30.1
      - name: The workflows mean what they say
        env:
          GH_TOKEN: ${{ github.token }}
          SHELLCHECK_OPTS: --severity=warning
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
          zizmor --min-severity medium .github

      # Nothing else looks at a subject that reached main without a pull request, and one push
      # can carry several: every commit it brought is weighed, not only the last.
      - name: The subjects that landed
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
            bash scripts/commits.sh --landed "$BEFORE..$AFTER"
          else
            bash scripts/commits.sh --title "$(git log -1 --no-merges --format=%s)"
          fi
