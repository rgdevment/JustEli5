version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      actions-majors:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: cargo
    directories:
      - /
      - /apps/mc-gui/src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    ignore:
      - dependency-name: "tauri*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    groups:
      rust:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      rust-majors:
        patterns:
          - "*"
        update-types:
          - major

  # Dependabot reads pnpm-lock.yaml under the npm ecosystem.
  - package-ecosystem: npm
    directory: /apps/mc-gui
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    ignore:
      - dependency-name: "@tauri-apps/*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    groups:
      window:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      window-majors:
        patterns:
          - "*"
        update-types:
          - major
