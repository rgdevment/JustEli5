name: What whisper.cpp builds with
description: >-
  cmake and a C++ compiler build whisper.cpp, and libclang generates its bindings. The runner
  images carry them; this makes sure. bindgen finds
  LLVM on Windows through LIBCLANG_PATH, which scripts/ci.sh and prepare-mc.mjs set.

runs:
  using: composite
  steps:
    - name: libclang on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        command -v clang >/dev/null && dpkg -s libclang-dev >/dev/null 2>&1 && exit 0
        sudo apt-get update -qq
        sudo apt-get install -y -qq clang libclang-dev

    - name: libclang on Windows
      if: runner.os == 'Windows'
      shell: bash
      run: |
        if [ ! -f "C:/Program Files/LLVM/bin/libclang.dll" ]; then
          choco install llvm -y --no-progress
        fi

    - name: cmake is there
      shell: bash
      run: cmake --version | head -1
