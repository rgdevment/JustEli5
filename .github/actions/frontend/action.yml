name: The window's frontend
description: Node and pnpm, and the window's dependencies installed from its lockfile.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 12
        run_install: false

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: apps/mc-gui/pnpm-lock.yaml

    - name: Dependencies
      shell: bash
      working-directory: apps/mc-gui
      run: pnpm install --frozen-lockfile
